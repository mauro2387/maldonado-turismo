    <!--
      Archivo: la grotesca de señalética del sistema. Se precarga la conexión a
      Google Fonts para que el primer render no espere el DNS.

      las pantallas de mapa. Tenerlo dos veces provocaba versiones distintas de
      L en la misma página.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap"
    />
